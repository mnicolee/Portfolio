<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" width="780" height="280" role="img" aria-label="Two naming conventions resolving onto a single entity with a persistent identifier.">
  <style>
    /* transparent background on purpose. */
    .l { font-family: system-ui, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #2B2226; font-weight: 600; }
    .m { font-family: Consolas, "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; fill: #6F6068; letter-spacing: 0.06em; }
  </style>
  <defs>
    <marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9C3F63" stroke="#9C3F63" stroke-width="1" stroke-linejoin="round"/>
    </marker>
    <marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#C68B33" stroke="#C68B33" stroke-width="1" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="300" height="62" rx="31" fill="#FFFFFF" stroke="#9C3F63" stroke-width="1.5"/>
  <text x="174" y="50" text-anchor="middle" class="m">NAMES THE COMPARTMENTS</text>
  <text x="174" y="72" text-anchor="middle" class="l">MBON-γ1pedc&gt;α/β</text>

  <rect x="456" y="24" width="300" height="62" rx="31" fill="#FFFFFF" stroke="#C68B33" stroke-width="1.5"/>
  <text x="606" y="50" text-anchor="middle" class="m">NAMES THE COARSER ANATOMY</text>
  <text x="606" y="72" text-anchor="middle" class="l">MB-MVP2</text>

  <path d="M 330 55 H 450" stroke="#6F6068" stroke-width="1.5" stroke-dasharray="6 6" stroke-linecap="round" fill="none"/>
  <text x="390" y="44" text-anchor="middle" class="m">the same cell</text>

  <path d="M 174 92 Q 300 110 330 152" stroke="#9C3F63" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#mc)"/>
  <path d="M 606 92 Q 480 110 450 152" stroke="#C68B33" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#md)"/>

  <rect x="234" y="160" width="312" height="66" rx="33" fill="#ECF1E4" stroke="#6E7F52" stroke-width="1.5"/>
  <text x="390" y="188" text-anchor="middle" class="l">one entity, one identifier</text>
  <text x="390" y="210" text-anchor="middle" class="m">both names kept, hanging off it</text>

  <text x="390" y="262" text-anchor="middle" class="m">neither name wins · the identifier underneath is the neuron</text>
</svg>
