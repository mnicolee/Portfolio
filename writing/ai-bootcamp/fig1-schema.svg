<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 434" width="780" height="434" role="img" aria-label="The generic vocabulary of neuroscience drawn as a knowledge graph schema, annotated with the AI terms: each box is an entity type, each arrow is a relationship, and a box-arrow-box triple is one fact.">
  <style>
    /* transparent background on purpose. Warm colours = neuroscience. Teal = AI vocabulary. */
    .l  { font-family: system-ui, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #2B2226; font-weight: 600; }
    .ls { font-family: system-ui, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #4F444A; }
    .m  { font-family: Consolas, "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; fill: #6F6068; letter-spacing: 0.06em; }
    .e  { font-family: Consolas, "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; fill: #7A2F4C; letter-spacing: 0.04em; }
    .ai { font-family: Consolas, "IBM Plex Mono", ui-monospace, monospace; font-size: 10.5px; fill: #2F6360; letter-spacing: 0.1em; font-weight: 600; }
  </style>
  <defs>
    <marker id="sch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6F6068" stroke="#6F6068" stroke-width="1" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path d="M 284 177 H 496" stroke="#6F6068" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#sch)"/>
  <path d="M 160 208 V 296" stroke="#6F6068" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#sch)"/>
  <path d="M 284 324 H 496" stroke="#6F6068" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#sch)"/>
  <path d="M 620 296 V 208" stroke="#6F6068" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#sch)"/>
  <path d="M 160 146 V 80" stroke="#6F6068" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#sch)"/>
  <path d="M 250 148 C 380 120 420 70 516 62" stroke="#6F6068" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#sch)"/>

  <rect x="60" y="30" width="200" height="46" rx="23" fill="#ECF1E4" stroke="#6E7F52" stroke-width="1.5"/>
  <text x="160" y="59" text-anchor="middle" class="ls">brain region</text>

  <rect x="520" y="30" width="200" height="46" rx="23" fill="#ECF1E4" stroke="#6E7F52" stroke-width="1.5"/>
  <text x="620" y="59" text-anchor="middle" class="ls">brain region</text>

  <rect x="40" y="150" width="240" height="54" rx="27" fill="#F6EAEE" stroke="#9C3F63" stroke-width="2"/>
  <text x="160" y="182" text-anchor="middle" class="l">presynaptic neuron</text>

  <rect x="500" y="150" width="240" height="54" rx="27" fill="#F6EAEE" stroke="#9C3F63" stroke-width="2"/>
  <text x="620" y="182" text-anchor="middle" class="l">postsynaptic neuron</text>

  <rect x="40" y="300" width="240" height="48" rx="24" fill="#FAF1E1" stroke="#C68B33" stroke-width="1.5"/>
  <text x="160" y="329" text-anchor="middle" class="ls">neurotransmitter</text>

  <rect x="500" y="300" width="240" height="48" rx="24" fill="#F2ECE0" stroke="#E2D8C8" stroke-width="1.5"/>
  <text x="620" y="329" text-anchor="middle" class="ls">receptor</text>

  <rect x="334" y="166" width="112" height="22" rx="11" fill="#FFFFFF"/>
  <text x="390" y="181" text-anchor="middle" class="e">synapses onto</text>

  <rect x="122" y="241" width="76" height="22" rx="11" fill="#FFFFFF"/>
  <text x="160" y="256" text-anchor="middle" class="e">releases</text>

  <rect x="352" y="313" width="76" height="22" rx="11" fill="#FFFFFF"/>
  <text x="390" y="328" text-anchor="middle" class="e">binds to</text>

  <rect x="586" y="241" width="68" height="22" rx="11" fill="#FFFFFF"/>
  <text x="620" y="256" text-anchor="middle" class="e">sits on</text>

  <rect x="112" y="102" width="96" height="22" rx="11" fill="#FFFFFF"/>
  <text x="160" y="117" text-anchor="middle" class="e">has soma in</text>

  <rect x="342" y="84" width="96" height="22" rx="11" fill="#FFFFFF"/>
  <text x="390" y="99" text-anchor="middle" class="e">projects to</text>

  <path d="M 330 214 L 282 202" stroke="#2F6360" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>
  <text x="336" y="224" class="ai">AN ENTITY TYPE</text>

  <path d="M 390 146 V 163" stroke="#2F6360" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>
  <text x="390" y="140" text-anchor="middle" class="ai">A RELATIONSHIP</text>

  <path d="M 40 366 V 376 H 740 V 366" stroke="#2F6360" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <text x="390" y="396" text-anchor="middle" class="ai">ENTITY · RELATIONSHIP · ENTITY = ONE FACT, STORED EXPLICITLY</text>

  <text x="390" y="422" text-anchor="middle" class="m">not one proper noun anywhere · this is the schema, not the data</text>
</svg>
