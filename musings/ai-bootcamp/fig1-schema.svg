<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" width="780" height="410" role="img" aria-label="The generic vocabulary of synaptic neuroscience drawn as a knowledge graph schema: a presynaptic neuron synapses onto a postsynaptic neuron and releases a neurotransmitter, which binds to a receptor sitting on the postsynaptic cell, and each neuron has its soma in a brain region. One box is marked as an entity type and one arrow as a relationship, as examples.">
  <style>
    /* Transparent background on purpose. One size and one font per role:
       node labels sans, everything else mono. Warm = neuroscience, teal = AI vocabulary. */
    .l  { font-family: system-ui, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #2B2226; font-weight: 600; }
    .e  { font-family: Consolas, "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px; fill: #7A2F4C; letter-spacing: 0.04em; }
    .ai { font-family: Consolas, "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; fill: #2F6360; letter-spacing: 0.1em; font-weight: 600; }
  </style>
  <defs>
    <marker id="sch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6F6068" stroke="#6F6068" stroke-width="1" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path d="M 284 177 H 496" stroke="#6F6068" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#sch)"/>
  <path d="M 160 208 V 296" stroke="#6F6068" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#sch)"/>
  <path d="M 284 324 H 496" stroke="#6F6068" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#sch)"/>
  <path d="M 620 296 V 208" stroke="#6F6068" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#sch)"/>
  <path d="M 160 146 V 80" stroke="#6F6068" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#sch)"/>
  <path d="M 620 146 V 80" stroke="#6F6068" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#sch)"/>

  <rect x="60" y="30" width="200" height="46" rx="23" fill="#ECF1E4" stroke="#6E7F52" stroke-width="1.5"/>
  <text x="160" y="60" text-anchor="middle" class="l">brain region</text>

  <rect x="520" y="30" width="200" height="46" rx="23" fill="#ECF1E4" stroke="#6E7F52" stroke-width="1.5"/>
  <text x="620" y="60" text-anchor="middle" class="l">brain region</text>

  <rect x="40" y="150" width="240" height="54" rx="27" fill="#F6EAEE" stroke="#9C3F63" stroke-width="2"/>
  <text x="160" y="183" text-anchor="middle" class="l">presynaptic neuron</text>

  <rect x="500" y="150" width="240" height="54" rx="27" fill="#F6EAEE" stroke="#9C3F63" stroke-width="2"/>
  <text x="620" y="183" text-anchor="middle" class="l">postsynaptic neuron</text>

  <rect x="40" y="300" width="240" height="48" rx="24" fill="#FAF1E1" stroke="#C68B33" stroke-width="1.5"/>
  <text x="160" y="330" text-anchor="middle" class="l">neurotransmitter</text>

  <rect x="500" y="300" width="240" height="48" rx="24" fill="#FAF1E1" stroke="#C68B33" stroke-width="1.5"/>
  <text x="620" y="330" text-anchor="middle" class="l">receptor</text>

  <rect x="330" y="166" width="120" height="22" rx="11" fill="#FFFFFF"/>
  <text x="390" y="181" text-anchor="middle" class="e">synapses onto</text>

  <rect x="118" y="241" width="84" height="22" rx="11" fill="#FFFFFF"/>
  <text x="160" y="256" text-anchor="middle" class="e">releases</text>

  <rect x="348" y="313" width="84" height="22" rx="11" fill="#FFFFFF"/>
  <text x="390" y="328" text-anchor="middle" class="e">binds to</text>

  <rect x="584" y="241" width="72" height="22" rx="11" fill="#FFFFFF"/>
  <text x="620" y="256" text-anchor="middle" class="e">sits on</text>

  <rect x="108" y="102" width="104" height="22" rx="11" fill="#FFFFFF"/>
  <text x="160" y="117" text-anchor="middle" class="e">has soma in</text>

  <rect x="568" y="102" width="104" height="22" rx="11" fill="#FFFFFF"/>
  <text x="620" y="117" text-anchor="middle" class="e">has soma in</text>

  <path d="M 330 214 L 275 198" stroke="#2F6360" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>
  <text x="336" y="224" class="ai">AN ENTITY TYPE</text>

  <path d="M 390 146 V 163" stroke="#2F6360" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>
  <text x="390" y="140" text-anchor="middle" class="ai">A RELATIONSHIP</text>

  <path d="M 40 366 V 376 H 740 V 366" stroke="#2F6360" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <text x="390" y="398" text-anchor="middle" class="ai">ENTITY · RELATIONSHIP · ENTITY = ONE FACT, STORED EXPLICITLY</text>
</svg>
